name: self-test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Bind checkout to pull request head
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git cat-file -e "$PR_BASE_SHA^{commit}" || git fetch --no-tags origin "$PR_BASE_SHA"
          git update-ref "refs/remotes/origin/$PR_BASE_REF" "$PR_BASE_SHA"
          test "$(git rev-parse "refs/remotes/origin/$PR_BASE_REF")" = "$PR_BASE_SHA"
          git checkout -B "$PR_HEAD_REF" "$PR_HEAD_SHA"
          test "$(git rev-parse HEAD)" = "$PR_HEAD_SHA"

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Install universal-ctags
        run: sudo apt-get update -qq && sudo apt-get install -y universal-ctags

      - name: Install test dependencies
        run: python -m pip install -e ".[test]" build

      - name: Run offline wheel and runtime bundle smoke
        run: >-
          PACKAGING=1 pytest -q
          tests/test_wheel_offline.py
          tests/test_runtime_bundle_integration.py

      - name: Install pinned OpenSpec for PR preflight
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          node --version
          npm --version
          node -e 'const [major, minor] = process.versions.node.split(".").map(Number); process.exit(major > 20 || (major === 20 && minor >= 19) ? 0 : 1)' || {
            echo "ERROR: canonical preflight requires Node.js 20.19.0 or newer" >&2
            exit 1
          }
          npm install --global @fission-ai/openspec@1.15.0
          openspec --version

      - name: Checkout canonical preflight engine
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          ENGINE_ROOT="$RUNNER_TEMP/paulsha-conventions"
          git clone --no-checkout https://github.com/hamanpaul/paulsha-conventions.git "$ENGINE_ROOT"
          test "$(git -C "$ENGINE_ROOT" remote get-url origin)" = "https://github.com/hamanpaul/paulsha-conventions.git"
          git -C "$ENGINE_ROOT" checkout --detach 2dcf2f815afeddc477c1cacc33df9beb06ae14fb
          test "$(git -C "$ENGINE_ROOT" rev-parse HEAD)" = "2dcf2f815afeddc477c1cacc33df9beb06ae14fb"

      - name: Run canonical preflight for pull request
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          PR_BODY_FILE="$RUNNER_TEMP/preflight-pr-body.md"
          export PR_BODY_FILE
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          event = json.loads(Path(os.environ["GITHUB_EVENT_PATH"]).read_text(encoding="utf-8"))
          body = event["pull_request"].get("body") or ""
          Path(os.environ["PR_BODY_FILE"]).write_text(body, encoding="utf-8")
          PY
          cd "$GITHUB_WORKSPACE"
          bash "$RUNNER_TEMP/paulsha-conventions/skills/preflight-ci/scripts/preflight.sh" \
            --offline \
            --pr-title "$PR_TITLE" \
            --pr-body-file "$PR_BODY_FILE" \
            --pr-labels "$PR_LABELS" \
            --base "$PR_BASE_REF" \
            --head "$PR_HEAD_REF"

      - name: Run pytest outside pull requests
        if: github.event_name != 'pull_request'
        run: pytest -q

  doc-drift-self-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1   # shallow checkout：確保 demo 端到端流程在 shallow 環境下仍可運行
      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - run: sudo apt-get update -qq && sudo apt-get install -y universal-ctags
      - name: Install test dependencies
        run: python -m pip install -e ".[test]"
      - run: python -m pytest -q tests/test_doc_drift_demo.py
