name: self-test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install universal-ctags
        run: sudo apt-get update -qq && sudo apt-get install -y universal-ctags

      - name: Install test dependencies
        run: python -m pip install -e ".[test]" build

      - name: Run offline wheel and runtime bundle smoke
        run: >-
          PACKAGING=1 pytest -q
          tests/test_wheel_offline.py
          tests/test_runtime_bundle_integration.py

      - name: Run pytest
        run: pytest -q

  doc-drift-self-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1   # shallow checkout：確保 demo 端到端流程在 shallow 環境下仍可運行
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - run: sudo apt-get update -qq && sudo apt-get install -y universal-ctags
      - name: Install test dependencies
        run: python -m pip install -e ".[test]"
      - run: python -m pytest -q tests/test_doc_drift_demo.py
